version: '3.8'

services:
  # ==========================================
  # SERVICIO MYSQL 8.0 (Bases de datos de Microservicios)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: mysql-carhub
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: zacky5023
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - carhub-infra-net

  # ==========================================
  # NODO 1 RABBITMQ (Master / Líder del Clúster)
  # ==========================================
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq1
    hostname: rabbit1
    restart: always
    environment:
      - RABBITMQ_ERLANG_COOKIE=CARHUB_CLUSTER_SECRET_COOKIE_2026
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"     # AMQP Broker
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
    networks:
      - carhub-infra-net

  # ==========================================
  # NODO 2 RABBITMQ (Nodo Miembro del Clúster)
  # ==========================================
  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbit2
    restart: always
    environment:
      - RABBITMQ_ERLANG_COOKIE=CARHUB_CLUSTER_SECRET_COOKIE_2026
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5673:5672"     # AMQP Broker Nodo 2
      - "15673:15672"   # Management UI Nodo 2
    depends_on:
      - rabbitmq1
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    networks:
      - carhub-infra-net

volumes:
  mysql_data:
  rabbitmq1_data:
  rabbitmq2_data:

networks:
  carhub-infra-net:
    name: carhub-infra-net
    driver: bridge
