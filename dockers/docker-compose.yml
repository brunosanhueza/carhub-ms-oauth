services:
  # ==========================================
  # SERVICIO MYSQL 8.0 (Bases de datos de Microservicios)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: mysql-carhub
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: zacky5023
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - carhub-infra-net

  # ==========================================
  # NODO 1 RABBITMQ (Master / Líder del Clúster)
  # ==========================================
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq1
    hostname: rabbit1
    restart: always
    environment:
      - RABBITMQ_ERLANG_COOKIE=CARHUB_CLUSTER_SECRET_COOKIE_2026
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"     # AMQP Broker
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
    networks:
      - carhub-infra-net

  # ==========================================
  # NODO 2 RABBITMQ (Nodo Miembro del Clúster)
  # ==========================================
  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbit2
    restart: always
    environment:
      - RABBITMQ_ERLANG_COOKIE=CARHUB_CLUSTER_SECRET_COOKIE_2026
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5673:5672"     # AMQP Broker Nodo 2
      - "15673:15672"   # Management UI Nodo 2
    depends_on:
      - rabbitmq1
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    networks:
      - carhub-infra-net

  # ==========================================
  # ZOOKEEPER (Coordinador del Clúster Kafka)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-carhub
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - carhub-infra-net

  # ==========================================
  # NODO 1 KAFKA BROKER (Puerto Host 5030)
  # ==========================================
  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka1-carhub
    hostname: kafka1
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "5030:5030"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:5030
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - carhub-infra-net

  # ==========================================
  # NODO 2 KAFKA BROKER (Puerto Host 5031)
  # ==========================================
  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka2-carhub
    hostname: kafka2
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "5031:5031"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29093,PLAINTEXT_HOST://localhost:5031
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - carhub-infra-net

  # ==========================================
  # KAFKA UI (Administración y Monitoreo Web)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-carhub
    restart: always
    depends_on:
      - kafka1
      - kafka2
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: carhub-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - carhub-infra-net

  # ==========================================
  # MICROSERVICIO AUTOMOTRIZ (Puerto 8061)
  # ==========================================
  automotriz:
    build:
      context: ../backend-automotriz/automotriz
      dockerfile: Dockerfile
    image: carhub-automotriz:latest
    container_name: backend-automotriz
    restart: always
    ports:
      - "8061:8061"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/automotriz
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=zacky5023
      - SPRING_RABBITMQ_HOST=rabbitmq1
      - SPRING_RABBITMQ_PORT=5672
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      - mysql
      - rabbitmq1
    networks:
      - carhub-infra-net

  # ==========================================
  # MICROSERVICIO VEHICULOS (Puerto 8062)
  # ==========================================
  vehiculos:
    build:
      context: ../backend-carhub-vehiculo/vehiculos
      dockerfile: Dockerfile
    image: carhub-vehiculos:latest
    container_name: backend-vehiculos
    restart: always
    ports:
      - "8062:8062"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/vehiculos
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=zacky5023
      - SPRING_RABBITMQ_HOST=rabbitmq1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      - mysql
      - rabbitmq1
      - kafka1
      - kafka2
    networks:
      - carhub-infra-net

  # ==========================================
  # MICROSERVICIO PIEZAS (Puerto 8063)
  # ==========================================
  piezas:
    build:
      context: ../backend-piezas/piezas
      dockerfile: Dockerfile
    image: carhub-piezas:latest
    container_name: backend-piezas
    restart: always
    ports:
      - "8063:8063"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/piezas
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=zacky5023
      - SPRING_RABBITMQ_HOST=rabbitmq1
      - SPRING_RABBITMQ_PORT=5672
      - SERVICES_USUARIO_URL=http://carhub:8066/api/v1/usuarios/
      - SERVICES_VEHICULO_URL=http://vehiculos:8062/api/v2/vehiculos/
      - SERVICES_AUTOMOTRIZ_URL=http://automotriz:8061/api/v3/automotriz/
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      - mysql
      - rabbitmq1
    networks:
      - carhub-infra-net

  # ==========================================
  # MICROSERVICIO RECLAMOS (Puerto 8064)
  # ==========================================
  reclamos:
    build:
      context: ../backend-reclamos/reclamos
      dockerfile: Dockerfile
    image: carhub-reclamos:latest
    container_name: backend-reclamos
    restart: always
    ports:
      - "8064:8064"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/reclamos
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=zacky5023
      - SPRING_RABBITMQ_HOST=rabbitmq1
      - SPRING_RABBITMQ_PORT=5672
      - SERVICES_USUARIO_URL=http://carhub:8066/api/v1/usuarios/
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      - mysql
      - rabbitmq1
    networks:
      - carhub-infra-net

  # ==========================================
  # MICROSERVICIO COMPRA (Puerto 8065)
  # ==========================================
  compra:
    build:
      context: ../backend-compra/compra
      dockerfile: Dockerfile
    image: carhub-compra:latest
    container_name: backend-compra
    restart: always
    ports:
      - "8065:8065"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/compra
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=zacky5023
      - SPRING_RABBITMQ_HOST=rabbitmq1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093
      - SERVICES_USUARIO_URL=http://carhub:8066/api/v1/usuarios/
      - SERVICES_VEHICULO_URL=http://vehiculos:8062/api/v2/vehiculos/
      - SERVICES_AUTOMOTRIZ_URL=http://automotriz:8061/api/v3/automotriz/
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      - mysql
      - rabbitmq1
      - kafka1
      - kafka2
    networks:
      - carhub-infra-net

  # ==========================================
  # MICROSERVICIO CARHUB / USUARIOS (Puerto 8066)
  # ==========================================
  carhub:
    build:
      context: ../backend-carhub
      dockerfile: Dockerfile
    image: carhub-usuarios:latest
    container_name: backend-carhub
    restart: always
    ports:
      - "8066:8066"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/usuarios
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=zacky5023
      - SPRING_RABBITMQ_HOST=rabbitmq1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      - mysql
      - rabbitmq1
      - kafka1
      - kafka2
    networks:
      - carhub-infra-net

volumes:
  mysql_data:
  rabbitmq1_data:
  rabbitmq2_data:
  zookeeper_data:
  zookeeper_log:
  kafka1_data:
  kafka2_data:

networks:
  carhub-infra-net:
    name: carhub-infra-net
    driver: bridge
