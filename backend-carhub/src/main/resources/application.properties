# ==========================================
# ZONA DE CONFIGURACION DE RABBITMQ (CENTRALIZADA)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Modo de confirmacion manual explicito (ACK / NACK)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Exchanges del sistema (Direct y Topic)
carhub.rabbitmq.exchange=carhub.exchange
carhub.rabbitmq.topic.exchange=carhub.topic.exchange
carhub.rabbitmq.dlx=carhub.dlx

# Rutas y Colas para Notificaciones de Usuario
carhub.rabbitmq.queue.usuario=backend-carhub.usuario.queue
carhub.rabbitmq.routingkey.usuario=backend-carhub.usuario.rk
carhub.rabbitmq.queue.usuario.dlq=backend-carhub.usuario.dlq
carhub.rabbitmq.routingkey.usuario.dlq=backend-carhub.usuario.dlq.rk



