spring.application.name=reclamos

server.port=8064

spring.datasource.url=jdbc:mysql://localhost:3306/reclamos

spring.datasource.username=root
spring.datasource.password=zacky5023

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.application.version=1.0

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# CONFIGURACIÓN RABBITMQ (CENTRALIZADA)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Modo de confirmación manual explícito (ACK / NACK)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Exchanges del sistema
carhub.rabbitmq.exchange=carhub.exchange
carhub.rabbitmq.dlx=carhub.dlx

# Rutas y Colas para Tickets de Soporte / Reclamos
carhub.rabbitmq.queue.reclamos=backend-reclamos.ticket.queue
carhub.rabbitmq.routingkey.reclamos=backend-reclamos.ticket.rk
carhub.rabbitmq.queue.reclamos.dlq=backend-reclamos.ticket.dlq
carhub.rabbitmq.routingkey.reclamos.dlq=backend-reclamos.ticket.dlq.rk
