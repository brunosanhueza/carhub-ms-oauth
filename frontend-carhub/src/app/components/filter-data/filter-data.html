<aside class="filters-sidebar vista-window">
  <div class="filters-header">
    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
    <h3>Filtros de Búsqueda</h3>
  </div>

  <div class="filter-group">
    <label for="marca">Marca de Vehículo</label>
    <select id="marca" [(ngModel)]="marcaSel" (change)="notificarFiltros()">
      <option value="">Todas las marcas</option>
      @for (marca of marcas; track $index) {
        <option [value]="marca">{{ marca }}</option>
      }
    </select>
  </div>

  <button class="aero-btn btn-clear-filters" (click)="limpiarFiltros()">
    Limpiar Filtros
  </button>
</aside>
