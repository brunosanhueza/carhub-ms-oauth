spring.application.name=compra
server.port=8065

spring.datasource.url=jdbc:mysql://localhost:3306/compra


spring.datasource.username=root
spring.datasource.password=zacky5023


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.application.version = 1.0

spring.jpa.hibernate.ddl-auto=update

# ==========================================
# CONFIGURACIÓN RABBITMQ (CENTRALIZADA)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Modo de confirmación manual explícito (ACK / NACK)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Exchanges del sistema
carhub.rabbitmq.exchange=carhub.exchange
carhub.rabbitmq.dlx=carhub.dlx

# Rutas y Colas para Tickets de Compra
carhub.rabbitmq.queue.compra=backend-compra.ticket.queue
carhub.rabbitmq.routingkey.compra=backend-compra.ticket.rk
carhub.rabbitmq.queue.compra.dlq=backend-compra.ticket.dlq
carhub.rabbitmq.routingkey.compra.dlq=backend-compra.ticket.dlq.rk

# ==========================================
# CONFIGURACIÓN APACHE KAFKA (PRODUCTOR STREAMING)
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:5030}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Tópico analítico de ventas
carhub.kafka.topic.ventas=carhub.ventas.streaming

